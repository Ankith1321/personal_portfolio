    <linearGradient id="sun" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7B15E"/>
      <stop offset="1" stop-color="#D47C43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A2431" flood-opacity="0.15"/>
    </filter>
  </defs>

