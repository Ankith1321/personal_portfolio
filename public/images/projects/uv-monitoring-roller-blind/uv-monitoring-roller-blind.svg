<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UV monitoring and roller-blind control illustration</title>
  <desc id="desc">A window scene with sunlight, a UV sensor, a Raspberry Pi-style controller, and a roller blind responding to a control signal.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="740" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#E8ECDF"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="80" x2="680" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C2737"/>
      <stop offset="1" stop-color="#243041"/>
    </linearGradient>
    <linearGradient id="glass" x1="160" y1="90" x2="430" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F4ED" stop-opacity="0.72"/>
